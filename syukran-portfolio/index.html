<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- NAV -->
  <nav class="nav">
    <a href="#profile" class="logo" data-bind="name"></a>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#gallery">Gallery</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>
  <div class="mobile-menu">
    <a href="#about">About</a><a href="#experience">Experience</a>
    <a href="#gallery">Gallery</a><a href="#contact">Contact</a>
  </div>

  <!-- HERO -->
  <section id="profile" class="hero">
    <div class="hero-pic photo" data-photo="profile"></div>
    <div class="hero-text">
      <p class="small" data-bind="greeting"></p>
      <h1 data-bind="name"></h1>
      <p class="role" data-bind="role"></p>
      <div class="btns">
        <a class="btn btn-outline" id="cv-btn" download>Download CV</a>
        <a class="btn btn-dark" href="#contact">Contact Info</a>
      </div>
      <div class="socials" id="hero-socials"></div>
    </div>
  </section>

  <!-- ABOUT -->
  <section id="about">
    <p class="small center">Get To Know More</p>
    <h2 class="title">About Me</h2>
    <div class="about-wrap">
      <div class="about-pic photo" data-photo="about"></div>
      <div class="about-right">
        <div class="cards" id="about-cards"></div>
        <p class="about-text" data-bind="about.text"></p>
      </div>
    </div>
  </section>

  <!-- EXPERIENCE -->
  <section id="experience">
    <p class="small center">Explore My</p>
    <h2 class="title">Experience</h2>
    <div class="skills" id="skills"></div>
  </section>

  <!-- GALLERY -->
  <section id="gallery">
    <p class="small center">Explore My Visual Work</p>
    <h2 class="title">Gallery</h2>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- CONTACT -->
  <section id="contact">
    <p class="small center">Get in Touch</p>
    <h2 class="title">Contact Me</h2>
    <div class="contact-box" id="contact-box"></div>
  </section>

  <footer>
    <ul class="nav-links">
      <li><a href="#about">About</a></li><li><a href="#experience">Experience</a></li>
      <li><a href="#gallery">Gallery</a></li><li><a href="#contact">Contact</a></li>
    </ul>
    <p id="copy"></p>
  </footer>

  <!-- PHOTO EDITOR (preview only) -->
  <button id="edit-toggle" title="Change photos">✎ Edit photos</button>
  <input type="file" id="file-pick" accept="image/*" hidden />

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
